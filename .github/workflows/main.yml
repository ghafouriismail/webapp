name: CI Pipeline

on:
  push:
    branches:
      - main  # Trigger the workflow on push to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Docker login using GitHub secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push the Docker image for the client
      - name: Build client Docker image
        run: |
          docker build -t ismailghafouri/webapp_repo-client:latest ./client
          docker push ismailghafouri/webapp_repo-client:latest

      # Build and push the Docker image for the server
      - name: Build server Docker image
        run: |
          docker build -t ismailghafouri/webapp_repo-server:latest ./server
          docker push ismailghafouri/webapp_repo-server:latest
